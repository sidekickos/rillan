# Rillan Project Plan
#
# This file is a structured, importable plan for the Rillan kernel product.
# It is NOT a rillan daemon project config — the daemon looks for project
# configs under `.rillan/project.yaml` or `.sidekick/project.yaml`, not at
# the repo root.
#
# Intended uses:
#   - Imported into a Linear workspace (one issue per `tickets[*]` entry)
#   - Committed in-repo as the canonical backlog/roadmap
#
# Source of truth: this file consolidates the prior `.sisyphus/plans/*.md`
# milestone docs and the `.sisyphus/plans/rillan-linear-seed.md` backlog.
# When status or acceptance criteria change, update this file.

project:
  name: Rillan
  summary: |
    Rillan is the kernel of a local-first Context Control Plane: a Go daemon
    that owns the local API boundary, context retrieval and compilation,
    policy enforcement, provider routing, and audit. Lyra (public client)
    and website/domain readiness are tracked separately.
  scope:
    in:
      - local API boundary on 127.0.0.1:8420
      - context retrieval, compilation, and bounded outbound minimization
      - three-tier policy (tier-0 encrypted system, tier-1 project, tier-2 ephemeral merge)
      - guarded agent runtime with proposal-gated effectful actions
      - adapter-host provider execution with bundled first-party presets
      - append-only audit ledger for remote egress
      - packaging and release hardening for macOS and Linux
    out:
      - Lyra public client and interaction layer
      - website and domain readiness
      - Windows runtime or cross-arch beyond amd64/arm64 on darwin/linux
      - learned / benchmark-driven routing
      - broad MCP write integration, background watchers, desktop autonomy
  public_roadmap:
    now: Deterministic routing intelligence over bundled and installed providers (M09)
    next: MCP server surface, cross-boundary topology support (daemon OS != client OS), and richer MCP execution
    later: OSS readiness, signed installers (MSI, DMG, deb, rpm) plus install script, public release hardening, and broader plugin surfaces

# Canonical architecture and product constraints that outlive any milestone.
# Kept here so imported tickets can reference stable IDs without pulling in
# long-form ADR content.
constraints:
  - id: C-LOCAL-BIND
    rule: |
      Default bind stays at 127.0.0.1:8420. Non-loopback binds require
      explicit opt-in, a keyring-backed auth token, TLS, and a policy
      verdict allowing the client's origin. This enables Lyra, WSL-bridged
      clients, and other cross-boundary topologies without abandoning the
      secure-by-default posture.
    source: ADR-002 (to be amended by the M-XPLAT topology ADR)
  - id: C-ANTHROPIC-OPTIN
    rule: Anthropic is never an implicit default; only user-supplied API key is supported.
    source: ADR-001
  - id: C-TIER0-LOCAL
    rule: Tier-0 system identity config is machine-local, encrypted or keychain-backed, never committed.
    source: ADR-008
  - id: C-TIER2-EPHEMERAL
    rule: Tier-2 policy merge is request-scoped and must not be persisted in combined form.
    source: ADR-008
  - id: C-AUDIT-APPEND-ONLY
    rule: Audit ledger is append-only JSONL; raw sensitive payloads are not stored verbatim.
    source: ADR-010
  - id: C-ROUTING-DETERMINISTIC
    rule: Routing decisions are deterministic, ordered, and explainable; no learned ranker.
    source: ADR-005
  - id: C-ADAPTER-HOST
    rule: Provider execution flows through the adapter host; the runtime must not collapse to a single built-in vendor path.
    source: ADR-004
  - id: C-DOCUMENTED-AUTH-ONLY
    rule: Only documented, automatable auth is supported; no subscriber cookies, reverse-engineered logins, or shared credentials.
    source: ADR-006

# Milestone history. Kept lightweight — the detail lives in adrs/ and the
# repo itself. Outstanding work is tracked under `tickets[*]` below.
milestones:
  - id: M01
    title: Daemon Skeleton and Proxy
    status: done
    description: |
      Go daemon with Cobra CLI (serve/init), OpenAI-compatible
      /v1/chat/completions on localhost:8420, provider adapter, YAML
      config with env overrides, structured logging with request IDs.
  - id: M02
    title: Local Knowledge Substrate
    status: done
    description: |
      Local metadata store, embedded-first vector storage, manual
      indexing pipeline, and deterministic rebuild/status flows. SQLite
      metadata with schema versioning, file discovery with glob filters,
      line-based chunking, `rillan index` and `rillan status` commands.
  - id: M03
    title: Retrieval and Context Compilation
    status: done
    description: |
      Inject retrieved local context into /v1/chat/completions through
      a bounded context compilation layer with source references and
      opt-in retrieval behavior. Retrieval pipeline with settings
      resolution, query builder, context compiler with char limits,
      debug metadata via X-Rillan-Retrieval-* headers.
  - id: M04
    title: Local Model Helpers
    status: done
    description: |
      Optional Ollama-first helper flows for query rewriting,
      contextual grep assistance, and other small-model tasks without
      making local models a startup dependency. Thin Ollama HTTP
      client, real embedding generation during indexing, query
      rewriting, readiness/status reporting of local-model connectivity.
  - id: M05
    title: Intent Classification and Policy
    status: in_progress
    remaining:
      - correction memory system (deferred out of the core M05 scope)
  - id: M06
    title: Security Completion and Remote-Egress Hardening
    status: in_progress
    description: |
      Policy enforcement, auditability, safer outbound handling, and
      OS-native packaging/service groundwork for macOS and Linux.
      Corresponds to the Linear project's "Milestone 05 - Security and
      Packaging Hardening" entry; the .sisyphus plans split this into
      M05 (policy) and M06 (security + packaging), so numbering differs
      between Linear's old shell and this file.
    remaining:
      - OS keychain validation on real macOS Keychain and Linux secret-service
      - deferred packaging backlog (launchd, systemd --user, lifecycle validation)
  - id: M06T
    title: Tokenizer-Backed Outbound Code Minimization (ADR-012)
    status: planned
    remaining:
      - 11 phased implementation tickets (currently mirrored in Linear SKA-238..SKA-248)
  - id: M07
    title: Guarded Agent Control Plane
    status: done
  - id: M07.5
    title: Command-Native Configuration and Capability Registry
    status: done
  - id: M08
    title: Adapter Host and Bundled First-Party Providers
    status: done
  - id: M09
    title: Deterministic Routing Intelligence
    status: planned
  - id: M-OSS
    title: OSS Readiness
    status: in_progress
    description: |
      License, governance, contributor workflow, signed releases,
      provenance, public doctrine docs, and repo-opening hygiene for
      Rillan as an open-source project.
    remaining:
      - license landed; governance, templates, signed releases (cosign provenance), disclosure policy pending
    notes: |
      signed-release workflow here is the cosign keyless provenance pipeline
      that produces the unsigned-for-OS-trust blobs consumed by M-INSTALL.
      Platform-specific code signing (Apple Developer ID, Windows code
      signing, Linux GPG) lives in M-INSTALL.
  - id: M-MCP-SERVER
    title: Rillan as MCP Server (expose project context to clients)
    status: planned
    remaining:
      - protocol handler, resources, prompts, tools bridge, auth/policy gating, per-session project binding
  - id: M-XPLAT
    title: Cross-Boundary Topology (daemon OS != client OS, incl. WSL)
    status: planned
    remaining:
      - bridge bind mode with auth+TLS, name-based project registry, WSL-aware paths, Windows daemon target, Windows packaging, Windows Credential Manager validation
  - id: M-INSTALL
    title: Signed Installers and Distribution Channels
    status: planned
    remaining:
      - trust/CA enrollment, Windows MSI, macOS DMG, Linux deb, Linux rpm, install script, optional channels (Homebrew, winget)

  # --- Forward milestones (scoped but not yet planned in detail) ---
  # Each of these is explicitly deferred from an earlier milestone's
  # "out of scope" list, or builds on a seam established earlier. They
  # capture direction without overcommitting to an implementation plan.

  - id: M10
    title: Adaptive Routing Signals
    status: planned
    description: |
      Build on M09's deterministic routing core with opt-in adaptive
      signals: recent-request latency/cost observations refine the
      fallback order, health backoff dampens flapping, and optional
      hedged/speculative dispatch helps tail latency. All signals
      remain explainable and bounded; no opaque learned ranker.
    builds_on: [M09]
    scope_hints:
      in:
        - EWMA latency/cost feedback into tie-breakers
        - health backoff and circuit-breaker behavior per candidate
        - optional hedged request dispatch with deterministic winner selection
      out:
        - benchmark-driven global scoring
        - learned / ML-based rankers
        - cost-optimization across provider billing contracts

  - id: M11
    title: Plugin SDK and Third-Party Provider Families
    status: planned
    description: |
      Extend ADR-004's adapter host to accept third-party provider
      families through a published SDK, manifest schema, and discovery
      protocol. Local-install-only at first; remote registries and
      marketplace are explicit non-goals.
    builds_on: [M08]
    scope_hints:
      in:
        - stable adapter-family SDK with versioned contract
        - manifest schema for third-party provider packages
        - local-path install flow with signature verification
        - contract-test harness exposed to plugin authors
      out:
        - remote plugin registries, marketplaces, or auto-update
        - third-party write-capable tool integrations
        - plugin-defined custom routing or policy logic

  - id: M12
    title: MCP Write Integration with Approval Flows
    status: planned
    description: |
      Extend the read-only MCP surface from M-MCP-SERVER with
      write-capable MCP operations routed through the existing M07
      proposal-approval gate. Writes to IDE workspaces, VCS, and ticket
      systems become proposable but never implicit.
    builds_on: [M-MCP-SERVER, M07]
    scope_hints:
      in:
        - typed MCP tools for apply_patch / run_tests / PR draft creation
        - approval flow identical to in-daemon effectful actions
        - audit coverage for MCP-initiated writes
      out:
        - auto-approval or trust ladders (remains an explicit later concern)
        - background watchers that fire writes without a user-initiated prompt

  - id: M13
    title: Correction Memory and Project Learning
    status: planned
    description: |
      Grow the first-pass correction memory (T-M05-01) into a
      structured per-project learning surface: anti-pattern artifacts,
      preferred-approach captures, and bounded "what worked last time"
      retrieval. Stays local-first and fully explainable; no opaque
      user models.
    builds_on: [M05]
    scope_hints:
      in:
        - typed correction artifact taxonomy with retention controls
        - retrieval injection rules bounded by policy and budget
        - operator tools to inspect and curate the learned set
      out:
        - cross-project knowledge transfer
        - automatic fine-tuning of remote models
        - any feature that would persist sensitive correction content in tier-0 or tier-1 surfaces

  - id: M14
    title: Team-Scoped Operation (Multi-Client, Multi-Project)
    status: planned
    description: |
      Build on M-XPLAT's named-project registry + bridge-bind mode to
      support multiple simultaneous clients and, eventually, multiple
      users sharing one rillan instance. Per-user tier-0, per-session
      project binding, and partitioned audit views.
    builds_on: [M-XPLAT, M-MCP-SERVER]
    scope_hints:
      in:
        - session identity model with per-user tier-0 resolution
        - concurrent sessions against different registered projects
        - partitioned audit views per user without weakening the ledger
      out:
        - full SaaS-style multi-tenancy or cross-org sharing
        - browser-based admin UI (belongs to Lyra, not kernel)

  - id: M15
    title: Compliance-Grade Audit and Forensics
    status: planned
    description: |
      Evolve M06's append-only JSONL audit ledger into a query-capable
      forensics surface with retention policy, redaction-at-export, and
      compliance-shaped exports (SOC 2 / ISO-ish trails). The on-disk
      ledger stays append-only and local; compliance features ride on
      top.
    builds_on: [M06]
    scope_hints:
      in:
        - structured query layer over the ledger with bounded retention
        - export formats with deterministic redaction rules
        - retention and rotation policy expressible in tier-0 config
      out:
        - centralized SIEM-style shipping by default
        - runtime mutation of audit records
        - any feature that would weaken the append-only guarantee

  - id: M16
    title: Parallel Sub-Agent Execution
    status: planned
    description: |
      Extend the shared agent runner to support coordinated parallel
      sub-agents with shared budget, structured handoff, and
      deterministic merge semantics. Explicit successor to M07's
      single-runner-with-role-profiles constraint.
    builds_on: [M07]
    scope_hints:
      in:
        - parallel role execution with bounded concurrency
        - shared budget accounting across sub-agents
        - deterministic result merging and conflict surfacing
      out:
        - unbounded or self-spawning agent fleets
        - parallel execution of effectful / write-capable actions (remains strictly sequential through approval gate)

labels:
  - policy
  - routing
  - packaging
  - audit
  - agent
  - tokenizer
  - oss
  - keyring
  - docs

priorities:
  urgent: 1
  high: 2
  medium: 3
  low: 4

# Tickets — the importable unit.
# Fields:
#   id              — stable internal ID (T-<milestone>-NN); not a Linear key
#   title           — issue title
#   milestone       — references milestones[*].id
#   status          — backlog | ready | in_progress | blocked | done | canceled
#   priority        — urgent | high | medium | low
#   labels          — list of labels above
#   summary         — one-paragraph description of the work
#   acceptance      — bullet list of verifiable acceptance checks
#   depends_on      — list of ticket ids that must land first
#   origin          — provenance: which .sisyphus plan or Linear ticket this came from
tickets:

  # ---------------------------------------------------------------------------
  # M05 — Intent Classification and Policy (trailing)
  # ---------------------------------------------------------------------------
  - id: T-M05-01
    title: Implement project-scoped correction memory
    milestone: M05
    status: backlog
    priority: medium
    labels: [policy, agent]
    summary: |
      Persist user corrections as project-scoped anti-pattern artifacts and
      inject them into future context packages. Requires project-scoped
      storage, retrieval injection rules, and schema/index changes beyond
      the current M05 storage model. Deferred out of the original M05 scope
      so the policy seam could ship on time.
    acceptance:
      - corrections are stored scoped to the owning project and do not leak across projects
      - retrieval injection surfaces the correction only for matching future context packages
      - index/storage migration paths are deterministic and test-covered
      - bounded by the same size/budget limits as other retrieved material
    depends_on: []
    origin: .sisyphus/plans/rillan-milestone-05.md Phase 6

  # ---------------------------------------------------------------------------
  # M06 — Security Completion and Remote-Egress Hardening (trailing)
  # ---------------------------------------------------------------------------
  - id: T-M06-01
    title: Validate tier-0 keyring path against real macOS Keychain
    milestone: M06
    status: backlog
    priority: high
    labels: [policy, keyring]
    summary: |
      The tier-0 encrypted system-config envelope currently has keyring-backed
      key-fetch mocked in tests. Exercise the real macOS Keychain path on
      supported darwin versions and confirm the daemon can decrypt into the
      in-memory policy struct without leaking raw key material into logs or
      ledger entries.
    acceptance:
      - smoke run on macOS Keychain boots into a valid tier-0 + tier-1 state
      - invalid or missing keychain item fails with a clear, non-secret-bearing error
      - logs and ledger contain no raw key material under normal or error paths
    depends_on: []
    origin: .sisyphus/plans/rillan-milestone-06.md Implementation Snapshot

  - id: T-M06-02
    title: Validate tier-0 keyring path against Linux secret-service / libsecret
    milestone: M06
    status: backlog
    priority: high
    labels: [policy, keyring]
    summary: |
      Same validation as T-M06-01 but against Linux secret-service backends
      (GNOME Keyring, KWallet via libsecret). Confirm the daemon behaves
      consistently across at least one GNOME-based and one KDE-based target
      distribution and that headless/service modes degrade predictably when
      no desktop secret service is available.
    acceptance:
      - smoke run on a GNOME-based distro with gnome-keyring-daemon succeeds
      - smoke run on a KDE-based distro with KWallet unlocked succeeds
      - headless/service mode returns a deterministic error when no secret service is reachable
    depends_on: []
    origin: .sisyphus/plans/rillan-milestone-06.md Implementation Snapshot

  - id: T-M06-03
    title: Ship macOS launchd user-level service packaging
    milestone: M06
    status: backlog
    priority: medium
    labels: [packaging]
    summary: |
      Promote the existing launchd groundwork to a first-class user-level
      packaging path. Ship the launchd plist, install/uninstall tooling or
      documented procedures, and route logs to an appropriate sink.
    acceptance:
      - `launchctl load` / `launchctl unload` cleanly starts and stops rillan serve
      - logs land in a predictable location (per-user log directory or unified log)
      - parity with foreground `rillan serve` is documented and test-covered
    depends_on: [T-M06-01]
    origin: .sisyphus/plans/rillan-milestone-06.md Deferred Backlog

  - id: T-M06-04
    title: Ship Linux systemd --user packaging
    milestone: M06
    status: backlog
    priority: medium
    labels: [packaging]
    summary: |
      Promote the existing systemd --user groundwork to a first-class
      packaging path. Ship the unit file, install/uninstall tooling, and
      integrate with journald for structured logs.
    acceptance:
      - `systemctl --user start rillan` starts the daemon reliably across target distros
      - journald receives structured slog output
      - install/uninstall steps are documented or automated
    depends_on: [T-M06-02]
    origin: .sisyphus/plans/rillan-milestone-06.md Deferred Backlog

  - id: T-M06-05
    title: Validate live service lifecycle on macOS and Linux
    milestone: M06
    status: backlog
    priority: medium
    labels: [packaging]
    summary: |
      Exercise install / start / stop / remove cycles of the packaged service
      on real macOS launchd and Linux systemd --user installations. Verify
      behavior parity with foreground `rillan serve`, including readiness
      semantics and audit ledger continuity across restarts.
    acceptance:
      - install/start/stop/remove is green on a reference macOS build
      - install/start/stop/remove is green on a reference Linux build
      - readiness and audit ledger remain consistent across restarts
    depends_on: [T-M06-03, T-M06-04]
    origin: .sisyphus/plans/rillan-milestone-06.md Deferred Backlog

  # ---------------------------------------------------------------------------
  # M06T — Tokenizer-backed outbound minimization (ADR-012)
  # These 11 tickets are currently mirrored in Linear as SKA-238..SKA-248;
  # the intent is to remove them from the current Linear project and reimport
  # them (or similar) into a different workspace.
  # ---------------------------------------------------------------------------
  - id: T-M06T-01
    title: Add outbound tokenizer abstraction
    milestone: M06T
    status: backlog
    priority: high
    labels: [tokenizer]
    summary: |
      Add a tokenizer seam in the outbound request-preparation path and
      integrate `github.com/tiktoken-go/tokenizer` as the first exact budgeting
      backend. Add deterministic model-family / encoding mapping for the
      bundled OpenAI-compatible presets.
    acceptance:
      - tokenizer is invokable from the request-prep path and returns exact token counts for bundled encodings
      - unsupported encodings degrade to a documented approximate count with a warning
      - go test ./internal/tokenize/... passes
    depends_on: []
    origin: Linear SKA-238 (plan reference: rillan-tokenize-implementation.md T001)

  - id: T-M06T-02
    title: Surface token-budget policy in request preparation
    milestone: M06T
    status: backlog
    priority: high
    labels: [tokenizer, policy]
    summary: |
      Extend the request-prep path after retrieval compilation and before
      provider dispatch to compose tokenizer budget checks with existing
      retrieval caps and policy verdicts. Local-only requests may skip
      minimization unless explicitly configured otherwise.
    acceptance:
      - token budget is evaluated only for remote-bound requests by default
      - budget decisions are surfaced in the policy trace
      - retrieval caps and token budgets compose deterministically and are test-covered
    depends_on: [T-M06T-01]
    origin: Linear SKA-241 (plan reference: T002)

  - id: T-M06T-03
    title: Add source span mapping primitives
    milestone: M06T
    status: backlog
    priority: high
    labels: [tokenizer]
    summary: |
      Define source-span mapping types keyed by document path, line ranges,
      byte offsets, and content hashes so minimization remains reversible.
      Reuse existing retrieval/index metadata as source identity.
    acceptance:
      - span types round-trip through encoding without losing source identity
      - ordered reconstruction metadata records preserved and dropped regions
      - unit tests cover overlap, adjacency, and hash-mismatch cases
    depends_on: []
    origin: Linear SKA-245 (plan reference: T003)

  - id: T-M06T-04
    title: Implement deterministic comment modes
    milestone: M06T
    status: backlog
    priority: high
    labels: [tokenizer]
    summary: |
      Implement the four comment modes (`include_all`, `include_relevant`,
      `include_annotations`, `exclude_all`) with deterministic preservation
      of license headers, build directives, generated markers, and
      policy-required comments. Support user-extensible annotation patterns.
    acceptance:
      - each mode produces identical output on repeated runs against the same input
      - license headers and build directives are preserved in all modes
      - annotation-pattern extension is tested and documented
    depends_on: [T-M06T-03]
    origin: Linear SKA-248 (plan reference: T004)

  - id: T-M06T-05
    title: Add local Ollama comment relevance classifier
    milestone: M06T
    status: backlog
    priority: high
    labels: [tokenizer, policy]
    summary: |
      Back the `include_relevant` mode with a bounded Ollama-backed classifier
      that emits categorical output (`relevant | irrelevant | uncertain`) with
      confidence gating. Fall back to deterministic defaults on timeout,
      malformed output, or low confidence.
    acceptance:
      - classifier output is bounded to the defined enum with confidence scores
      - timeouts and malformed output deterministically fall back and are logged
      - classifier is only invoked when `include_relevant` mode is active
    depends_on: [T-M06T-04]
    origin: Linear SKA-240 (plan reference: T005)

  - id: T-M06T-06
    title: Add local translation artifact store
    milestone: M06T
    status: backlog
    priority: medium
    labels: [tokenizer, audit]
    summary: |
      Add SQLite-backed storage for minimized translation artifacts, keyed by
      source hash, span identity, tokenizer encoding, comment mode, and
      request/material hash. Artifacts are short-lived and non-authoritative.
    acceptance:
      - artifacts round-trip reliably and expose before/after token counts plus artifact hash
      - cache key includes all inputs needed for exact-match reuse
      - TTL and size caps are configurable and enforced
    depends_on: [T-M06T-03]
    origin: Linear SKA-239 (plan reference: T006)

  - id: T-M06T-07
    title: Add optional vector-assisted short-term reuse
    milestone: M06T
    status: backlog
    priority: medium
    labels: [tokenizer]
    summary: |
      Evaluate embedding- or summary-indexed lookup for minimized artifacts
      so nearby repeated questions can benefit from reuse. Reuse must still
      gate on exact compatibility checks and is advisory, not authoritative.
    acceptance:
      - vector lookup never bypasses exact source/settings compatibility
      - disabling the feature cleanly reverts to the deterministic artifact store
      - integration tests cover reuse hit, miss, and compatibility-mismatch cases
    depends_on: [T-M06T-06]
    origin: Linear SKA-243 (plan reference: T007)

  - id: T-M06T-08
    title: Add config and request-override surface for minimization
    milestone: M06T
    status: backlog
    priority: high
    labels: [tokenizer, policy]
    summary: |
      Add global/project config fields for minimization mode, comment mode,
      token budget, annotation patterns, and TTL/reuse settings. Decide
      whether per-request overrides mirror the `retrieval` override style.
      Project config must not weaken machine-local (tier-0) constraints.
    acceptance:
      - config load/validate covers new fields and rejects conflicting combinations
      - per-request overrides (if added) are bounded by policy and documented
      - project config cannot relax tier-0 minimization requirements
    depends_on: [T-M06T-02, T-M06T-04]
    origin: Linear SKA-246 (plan reference: T008)

  - id: T-M06T-09
    title: Add audit and debug metadata for minimization
    milestone: M06T
    status: backlog
    priority: high
    labels: [tokenizer, audit]
    summary: |
      Extend audit/debug metadata with token counts, minimization mode,
      comment mode, artifact IDs, and whether Ollama participated. Keep raw
      minimized code out of the durable audit ledger by default. Surface
      enough debug output to explain why comments were kept or dropped.
    acceptance:
      - audit ledger records minimization metadata without raw outbound content by default
      - debug headers/fields expose comment-mode decisions on a per-request basis
      - regression tests prove secret-like material is not leaked through debug surfaces
    depends_on: [T-M06T-04, T-M06T-08]
    origin: Linear SKA-247 (plan reference: T009)

  - id: T-M06T-10
    title: Integration coverage for minimization behavior
    milestone: M06T
    status: backlog
    priority: high
    labels: [tokenizer]
    summary: |
      Add end-to-end request-path tests covering local-only vs remote-bound
      behavior, outbound token-count comparisons before/after minimization,
      and comment-mode behavior under representative queries.
    acceptance:
      - remote-bound payloads are measurably smaller under relevant modes
      - local-only requests bypass minimization unless explicitly enabled
      - coverage crosses retrieval, policy, local model, storage, and provider-prep seams
    depends_on: [T-M06T-05, T-M06T-08, T-M06T-09]
    origin: Linear SKA-244 (plan reference: T010)

  - id: T-M06T-11
    title: Document minimization runtime contract and operational guidance
    milestone: M06T
    status: backlog
    priority: medium
    labels: [tokenizer, docs]
    summary: |
      Update `docs/reference.md` with new settings and request overrides,
      and `docs/architecture.md` with the new request-path seam. Document
      supported comment modes, tokenizer-family caveats, and graceful
      degradation.
    acceptance:
      - docs explain the minimization contract, modes, and degradation paths
      - operator guidance covers tuning, disabling, and troubleshooting
      - examples match the shipped config surface and request overrides
    depends_on: [T-M06T-08, T-M06T-09]
    origin: Linear SKA-242 (plan reference: T011)

  # ---------------------------------------------------------------------------
  # M09 — Deterministic Routing Intelligence
  # ---------------------------------------------------------------------------
  - id: T-M09-01
    title: Define routing types and capability taxonomy
    milestone: M09
    status: backlog
    priority: high
    labels: [routing]
    summary: |
      Introduce `ModelDescriptor` and `CandidateStatus` types and derive
      model strengths from configured entries and bundled preset metadata
      rather than hand-coded switches. Include execution location and
      capability metadata needed for routing.
    acceptance:
      - types live under `internal/routing/` and are covered by fixture tests
      - task strengths are keyed to `policy.ActionType`
      - metadata validation lives alongside existing config validation
    depends_on: []
    origin: .sisyphus/plans/rillan-milestone-09.md Phase 1

  - id: T-M09-02
    title: Encode deterministic decision invariants and route-matrix tests
    milestone: M09
    status: backlog
    priority: high
    labels: [routing]
    summary: |
      Write the route-matrix test suite before implementation. Encode ordered
      decision rules: explicit pin, policy eligibility, task-strength match,
      local/cloud preference fit, health, latency, stable tie-break. Include
      negative cases for no-eligible-route and conflicting constraints.
    acceptance:
      - table tests for all ordered rules fail meaningfully without an implementation
      - determinism property: identical inputs always yield identical `RouteDecision`
      - negative cases produce explicit structured failures, not silent fallbacks
    depends_on: [T-M09-01]
    origin: .sisyphus/plans/rillan-milestone-09.md Phase 2

  - id: T-M09-03
    title: Collect candidate status facts
    milestone: M09
    status: backlog
    priority: high
    labels: [routing]
    summary: |
      Build a candidate-status layer over configured entries, using
      documented readiness/auth checks plus recent request outcomes. Mark
      unsupported backend/transport or invalid-auth candidates as
      unavailable with explicit reasons.
    acceptance:
      - configured-but-unauthenticated, authenticated-but-unhealthy, and healthy-local cases all have tests
      - unavailable-reason is a closed enum surfaced in both status and audit
      - refresh cadence is explicit and documented
    depends_on: [T-M09-01]
    origin: .sisyphus/plans/rillan-milestone-09.md Phase 3

  - id: T-M09-04
    title: Implement deterministic DecideRoute engine
    milestone: M09
    status: backlog
    priority: high
    labels: [routing, policy]
    summary: |
      Implement `DecideRoute` over descriptors, candidate status, policy
      verdicts, classification output, and project preferences. Policy
      verdicts shrink the candidate pool before ranking. Use ordered rules
      rather than weighted scores.
    acceptance:
      - route-matrix coverage for `code_generation`, `architecture`, `review`, `general_qa`, and trade-secret/local-only
      - policy outranks quality/latency hints in all tests
      - returns both winning candidate and per-candidate rejection reasons
    depends_on: [T-M09-02, T-M09-03]
    origin: .sisyphus/plans/rillan-milestone-09.md Phase 4

  - id: T-M09-05
    title: Integrate per-request routing into the chat path
    milestone: M09
    status: backlog
    priority: high
    labels: [routing]
    summary: |
      Integrate route selection into the chat request path after
      classification and policy preflight. Respect project route preferences
      and task-specific overrides. Explicit provider/model pins still win
      when policy allows.
    acceptance:
      - the HTTP path routes per request, not from a startup-selected provider
      - integration tests prove project preferences and allowlists affect selection
      - explicit pins and policy denials are honored correctly
    depends_on: [T-M09-04]
    origin: .sisyphus/plans/rillan-milestone-09.md Phase 5

  - id: T-M09-06
    title: Emit route decision traces and deterministic fallback
    milestone: M09
    status: backlog
    priority: high
    labels: [routing, audit]
    summary: |
      Emit a structured `RouteDecision` into audit/log/debug outputs. Add
      deterministic fallback order when the preferred route is unavailable,
      and return a structured "no eligible route" failure when nothing
      survives policy + status filtering.
    acceptance:
      - decision traces appear in audit ledger, logs, and debug headers without secrets
      - fallback order is stable, documented, and test-covered
      - no-eligible-route errors are structured and distinguishable from provider failures
    depends_on: [T-M09-05]
    origin: .sisyphus/plans/rillan-milestone-09.md Phase 6

