  # ---------------------------------------------------------------------------
  # M-MCP-SERVER — Rillan as MCP Server
  # ---------------------------------------------------------------------------
  - id: T-MCP-01
    title: Implement MCP server protocol handler over stdio and HTTP transports
    milestone: M-MCP-SERVER
    status: backlog
    priority: high
    labels: [agent, routing]
    summary: |
      Add an MCP server surface that implements the MCP protocol's
      initialize / resources / prompts / tools methods. Support stdio for
      same-host clients and HTTP for cross-boundary clients (WSL, Lyra,
      remote sessions). Stdio must be explicitly same-host-only because it
      does not cross Windows <-> WSL cleanly.
    acceptance:
      - a reference MCP client (e.g. opencode, Claude Desktop) can initialize a session over both transports where supported
      - stdio transport refuses to start in bridge-bind topologies with a clear error
      - protocol versioning and capability negotiation follow the MCP spec exactly
    depends_on: []
    origin: design discussion around multi-project client-awareness (MCP as the "additional requirements" mechanism)

  - id: T-MCP-02
    title: Expose project context as MCP resources
    milestone: M-MCP-SERVER
    status: backlog
    priority: high
    labels: [agent]
    summary: |
      Surface project config (system_prompt, instructions, sources summary)
      and bounded retrieval snapshots as MCP resources so clients can
      discover and attach them. Resources must be read-only and bounded by
      the same policy/budget rules as the chat-completions path.
    acceptance:
      - resources/list returns project.yaml-derived entries plus indexed-source summaries
      - resources/read is bounded in size and enforces tier-1/2 policy
      - raw tier-0 material and secrets never appear in any resource body
    depends_on: [T-MCP-01]
    origin: design discussion

  - id: T-MCP-03
    title: Expose canned MCP prompts with project context baked in
    milestone: M-MCP-SERVER
    status: backlog
    priority: medium
    labels: [agent]
    summary: |
      Surface a small set of prompts (e.g. "plan this change", "review this
      diff", "explain this file") as MCP prompts, each parameterized over
      project context so clients can invoke them with one click.
    acceptance:
      - prompts/list returns a stable, documented set keyed by role profile
      - prompts/get substitutes project metadata and returns bounded message templates
      - prompts do not bypass policy, routing, or auditability
    depends_on: [T-MCP-02]
    origin: design discussion

  - id: T-MCP-04
    title: Bridge read-only built-in tools as MCP tools
    milestone: M-MCP-SERVER
    status: backlog
    priority: high
    labels: [agent, routing]
    summary: |
      Expose the existing read-only ToolSource / ToolExecutor seam (M08) as
      MCP tools. Effectful / proposal-gated operations remain off the MCP
      tool surface; approval still flows through the chat-completions path.
    acceptance:
      - tools/list mirrors ListReadOnlyTools() output
      - tools/call invokes the existing executor with the same bounds and audit trace
      - write-capable operations are not exposed via MCP and attempting to register them fails at startup
    depends_on: [T-MCP-01]
    origin: design discussion

  - id: T-MCP-05
    title: Auth and policy gating for the MCP surface
    milestone: M-MCP-SERVER
    status: backlog
    priority: high
    labels: [policy, agent]
    summary: |
      Gate the MCP surface behind the same bind + auth model as the
      chat-completions path. Loopback clients run without auth by default;
      bridge-bind topologies require the keyring-backed token and TLS.
      Policy verdicts can refuse specific resources/tools per project
      classification.
    acceptance:
      - loopback MCP sessions work without a token by default
      - bridge-bind MCP sessions reject unauthenticated or non-TLS connections
      - policy verdicts can exclude resources/tools from a session deterministically
    depends_on: [T-MCP-01, T-XPLAT-01]
    origin: design discussion

  - id: T-MCP-06
    title: Per-session project binding via MCP
    milestone: M-MCP-SERVER
    status: backlog
    priority: high
    labels: [agent, routing]
    summary: |
      Bind each MCP session to one registered project by name. Session
      resources, prompts, tools, and subsequent chat-completions traffic
      (linked via a session token or header) use that project's tier-1
      config. This replaces the current single-project-per-daemon limit
      without reintroducing path-based CWD probing.
    acceptance:
      - MCP initialize accepts a project name and fails clearly for unknown names
      - chat-completions requests correlated to the session use the bound project's config
      - unbound sessions get a documented default (first registered project, or refusal)
    depends_on: [T-MCP-02, T-XPLAT-02]
    origin: design discussion

  # ---------------------------------------------------------------------------
  # M-XPLAT — Cross-Boundary Topology (daemon OS != client OS, incl. WSL)
  # ---------------------------------------------------------------------------
  - id: T-XPLAT-01
    title: Bridge bind mode with keyring-backed auth token and TLS
    milestone: M-XPLAT
    status: backlog
    priority: high
    labels: [policy, packaging]
    summary: |
      Add an explicit bind mode for non-loopback clients. Bind to a
      specified interface (or 0.0.0.0 behind host-level firewalling), serve
      TLS with a locally generated cert, and require a keyring-backed
      bearer token on every request. Loopback remains the zero-config path.
    acceptance:
      - loopback mode is unchanged and remains the default
      - bridge mode fails closed without a provisioned token and cert
      - policy surface can refuse bridge-mode binds for projects classified trade_secret
    depends_on: []
    origin: design discussion — daemon-on-Windows, client-in-WSL topology

  - id: T-XPLAT-02
    title: Name-based project registry
    milestone: M-XPLAT
    status: backlog
    priority: high
    labels: [agent]
    summary: |
      Replace path-based project identity with a name-based registry.
      `rillan project register --name <n> --root <path>` stores the
      association in the daemon's state; clients select a project by name
      via MCP init or an `X-Rillan-Project` header. The daemon owns path
      resolution, which fixes WSL and cross-mount path translation issues.
    acceptance:
      - registry commands (register/list/remove) are symmetric and covered by tests
      - all request-path project resolution goes through the registry; no path-from-client acceptance paths remain
      - unknown project names return a deterministic 4xx with an actionable hint
    depends_on: []
    origin: design discussion

  - id: T-XPLAT-03
    title: WSL-aware path translation for daemon-side filesystem access
    milestone: M-XPLAT
    status: backlog
    priority: medium
    labels: [packaging]
    summary: |
      When the daemon runs on Windows and a registered project root points
      at WSL (`\\wsl.localhost\<distro>\...`), normalize paths, handle
      symlink / case / permission differences, and document fallback
      behavior when the distro is stopped. Keep translation contained to
      the registry layer; upstream code paths see normalized absolute paths.
    acceptance:
      - registering a WSL path on Windows succeeds and indexes correctly
      - daemon degrades with a clear error when the distro is stopped
      - symlink, case, and permission edge cases are test-covered
    depends_on: [T-XPLAT-02]
    origin: design discussion

  - id: T-XPLAT-04
    title: Windows as a first-class daemon runtime target
    milestone: M-XPLAT
    status: backlog
    priority: high
    labels: [packaging, oss]
    summary: |
      Promote Windows from "architecturally possible" (per ADR-002) to a
      supported runtime. Cross-compile for windows/amd64 and windows/arm64,
      validate core test suites, and cover Windows-specific path/ACL
      behavior.
    acceptance:
      - CI builds and tests windows/amd64 at minimum, arm64 as stretch
      - filesystem, config-path, and keyring shims use Windows-native APIs via build tags
      - ADR-002 amendment recorded for platform scope expansion
    depends_on: []
    origin: design discussion

  - id: T-XPLAT-05
    title: Windows packaging (Windows Service)
    milestone: M-XPLAT
    status: backlog
    priority: medium
    labels: [packaging]
    summary: |
      Ship a Windows Service packaging path for rillan serve, symmetric to
      the launchd/systemd--user backlog items. Install/uninstall/start/stop
      tooling, event-log integration, and parity with foreground
      `rillan serve` are required.
    acceptance:
      - `sc.exe` or equivalent install/start/stop/remove is documented or automated
      - logs route to Windows Event Log or a predictable file sink
      - behavior parity with `rillan serve` is test-covered on a Windows reference build
    depends_on: [T-XPLAT-04]
    origin: design discussion (mirror of T-M06-03 / T-M06-04 for Windows)

  - id: T-XPLAT-06
    title: Windows Credential Manager validation for tier-0
    milestone: M-XPLAT
    status: backlog
    priority: high
    labels: [policy, keyring]
    summary: |
      Validate the tier-0 keyring path against Windows Credential Manager
      (DPAPI-backed) when rillan runs on Windows. Tier-0 secrets bind to
      the daemon's host OS, not the client's; this must be explicit in
      operator docs.
    acceptance:
      - tier-0 encrypt/decrypt round-trips against Credential Manager on a Windows reference build
      - missing or inaccessible credential returns a clear, non-secret-bearing error
      - operator docs state tier-0 binds to the daemon host, regardless of client OS
    depends_on: [T-XPLAT-04]
    origin: design discussion (parallel to T-M06-01 / T-M06-02)

  - id: T-XPLAT-07
    title: Topology ADR amending C-LOCAL-BIND doctrine
    milestone: M-XPLAT
    status: backlog
    priority: high
    labels: [docs, policy]
    summary: |
      Record an ADR that amends ADR-002's local-bind-only posture: default
      remains loopback, non-loopback is permitted under explicit bridge
      mode with auth+TLS+policy gating, and documents the Windows/WSL,
      Lyra, and remote-client topologies this enables.
    acceptance:
      - ADR committed under adrs/ with the new doctrine and rationale
      - README and docs/architecture.md updated to reflect the amended posture
      - C-LOCAL-BIND in this file references the new ADR rather than ADR-002 alone
    depends_on: [T-XPLAT-01]
    origin: design discussion

  # ---------------------------------------------------------------------------
  # M-INSTALL — Signed installers and distribution channels
  # ---------------------------------------------------------------------------
  - id: T-INSTALL-01
    title: Enroll in code-signing programs and track cert lifecycle
    milestone: M-INSTALL
    status: backlog
    priority: high
    labels: [packaging, oss, docs]
    summary: |
      Prerequisite tracking ticket. Enroll in Apple Developer Program for
      Developer ID Application + Installer certs and notarization; procure
      a Windows EV (preferred) or OV code-signing certificate, preferring
      a CA that offers cloud-HSM / signing-as-a-service (SSL.com eSigner,
      DigiCert KeyLocker, or Azure Key Vault Premium) so CI can sign
      without a physical token; generate and publish a Linux packaging
      GPG key. Record expiry dates, renewal owner, and rotation runbook.

      Hardware note: only FIPS 140-2 L2 YubiKeys (the "FIPS" SKUs, not
      the standard YubiKey 5 line) qualify under the post-2023 CA/B
      baseline for Windows code signing. A non-FIPS YubiKey remains the
      right tool for three adjacent trust jobs:
        - Linux GPG package signing (signing subkey held on-device)
        - Apple Developer account 2FA (protect the account that holds
          Developer ID access)
        - GitHub account 2FA (protect the identity that drives cosign
          OIDC signing)
      A FIPS-variant YubiKey is only worth buying if the chosen Windows
      CA accepts BYOD; cloud HSM / eSigner is the lower-friction default.
    acceptance:
      - Apple Developer enrollment active with Developer ID App + Installer certs issued
      - Windows code-signing cert provisioned; cloud-HSM / signing-as-a-service path verified against CI
      - Linux packaging GPG key generated, backed up, published, and (where possible) held on a hardware token
      - hardware-backed 2FA active on Apple Developer and GitHub accounts driving signing
      - cert/key inventory, expiry, rotation runbook, and HSM strategy committed to docs/
    depends_on: []
    origin: design discussion on installer trust

  - id: T-INSTALL-02
    title: macOS signed and notarized DMG
    milestone: M-INSTALL
    status: backlog
    priority: high
    labels: [packaging]
    summary: |
      Produce a signed .app bundle and distribute via .dmg (and optionally
      .pkg). Sign with Developer ID Application, staple notarization
      tickets, and verify Gatekeeper acceptance on a clean reference
      machine. Build both arm64 and amd64 or ship a universal binary.
    acceptance:
      - DMG installs cleanly on reference macOS without Gatekeeper/notarization warnings
      - arm64 and amd64 coverage is verified
      - `spctl --assess` and `codesign --verify` succeed on the artifact
    depends_on: [T-INSTALL-01]
    origin: design discussion

  - id: T-INSTALL-03
    title: Windows signed MSI installer
    milestone: M-INSTALL
    status: backlog
    priority: high
    labels: [packaging]
    summary: |
      Build an MSI (WiX or equivalent) that installs rillan as a Windows
      service (shares work with T-XPLAT-05), registers event-log sources,
      and lays down config/data paths. Sign the installer and the embedded
      binaries with the Windows code-signing cert; verify SmartScreen
      behavior (instant reputation with EV, building reputation with OV).
    acceptance:
      - signed MSI installs and uninstalls cleanly on Windows 10 and 11 reference builds
      - both amd64 and arm64 artifacts ship
      - SmartScreen behavior is documented based on the procured cert type (EV vs OV)
    depends_on: [T-INSTALL-01, T-XPLAT-04, T-XPLAT-05]
    origin: design discussion

  - id: T-INSTALL-04
    title: Linux .deb package for modern Debian/Ubuntu
    milestone: M-INSTALL
    status: backlog
    priority: high
    labels: [packaging]
    summary: |
      Produce a .deb for recent Debian stable and Ubuntu LTS releases.
      Include systemd --user unit (from T-M06-04), register conffiles for
      config paths, and sign the package plus any published repository
      Release files with the packaging GPG key.
    acceptance:
      - deb installs, starts the user service, and uninstalls cleanly on reference distros
      - amd64 and arm64 artifacts are produced
      - GPG signing verified end-to-end; users can verify the signature without trusting a third party
    depends_on: [T-INSTALL-01, T-M06-04]
    origin: design discussion

  - id: T-INSTALL-05
    title: Linux .rpm package for Fedora/RHEL/openSUSE
    milestone: M-INSTALL
    status: backlog
    priority: high
    labels: [packaging]
    summary: |
      Produce an .rpm for recent Fedora, RHEL/CentOS/Alma/Rocky, and
      openSUSE. Include the systemd --user unit, declare config %ghost
      entries correctly, and sign the package with the packaging GPG key.
    acceptance:
      - rpm installs and uninstalls cleanly on reference distros
      - amd64 and arm64 artifacts are produced
      - `rpm --checksig` confirms signature validity against the published key
    depends_on: [T-INSTALL-01, T-M06-04]
    origin: design discussion

  - id: T-INSTALL-06
    title: One-line install script (install.sh)
    milestone: M-INSTALL
    status: backlog
    priority: medium
    labels: [packaging, oss]
    summary: |
      Ship an install.sh served from the canonical domain that detects OS
      and arch, downloads the correct signed artifact, verifies checksum
      plus cosign signature (from T-OSS-06), and installs into a sensible
      user-local path. Script must fail loudly on signature mismatch and
      must not require curl-to-root semantics for basic developer installs.
    acceptance:
      - script installs successfully on macOS, recent Linux, and WSL
      - signature/checksum verification is mandatory and test-covered
      - script's source is auditable and small enough to read in one sitting
    depends_on: [T-INSTALL-02, T-INSTALL-04, T-INSTALL-05, T-OSS-06]
    origin: design discussion

  - id: T-INSTALL-07
    title: Distribution channel submissions (Homebrew, winget)
    milestone: M-INSTALL
    status: backlog
    priority: medium
    labels: [packaging, oss, docs]
    summary: |
      Submit rillan to community distribution channels where onboarding
      friction is low: a Homebrew tap (or homebrew-core once stable), and
      a winget manifest for Windows. These channels are optional and ride
      on top of the signed artifacts produced by T-INSTALL-02 and
      T-INSTALL-03.
    acceptance:
      - `brew install rillan` works from the published tap
      - `winget install rillan` works from the winget-pkgs manifest
      - submission procedure and update cadence are documented for each channel
    depends_on: [T-INSTALL-02, T-INSTALL-03]
    origin: design discussion

# Work that is explicitly out of the Rillan kernel scope but needs a home.
# These items should NOT be imported into the kernel Linear project; they
# are captured here so the decision to separate them is not lost.
out_of_kernel:
  - id: T-EXT-01
    title: Lyra public client and interaction layer workstream
    summary: |
      Lyra is the separate public client/interaction layer that consumes the
      Rillan kernel. Product-surface, UX, and cross-platform client
      decisions live with Lyra, not with the kernel roadmap.
    disposition: track in a separate Lyra project/workspace; do not mix into the kernel backlog
    origin: Linear SKA-249

  - id: T-EXT-02
    title: Website and domain readiness
    summary: |
      Marketing site, public domain selection, and docs-site readiness are
      product-surface concerns that should not delay kernel milestones.
    disposition: track as a website/domain workstream, likely alongside Lyra
    origin: Linear SKA-249

# Known cross-cutting risks surfaced across the original plans.
risks:
  - OS keychain integration variance across darwin/linux, especially headless/service modes (M06)
  - false positives in deterministic secret scanning (M05)
  - protocol drift inside the "OpenAI-compatible" family across bundled presets (M08, ongoing)
  - learned-router temptation during M09; must stay deterministic and ordered
  - descriptor drift if preset capability metadata falls out of sync with real upstream behavior (M09)
